name: Run Pālolo LFM Validation
on: 
  push:
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install GIS libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libexpat1
          pip install numpy matplotlib rasterio scipy scikit-image
          
      - name: Download Oahu DEM
        run: wget https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/n22w158/USGS_13_n22w158.tif
          
      - name: Run Pālolo validation
        run: python validate_palolo.py
        
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: palolo-results
          path: palolo_bottlenecks.png
