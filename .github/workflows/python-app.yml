name: Pālolo LFM Validation

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install GIS libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev
        pip install numpy pandas rasterio geopandas shapely pyproj
        
    - name: Download Oahu DEM
      run: |
        wget https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1/TIFF/current/n21w158/USGS_1_n21w158.tif
        
    - name: Run Pālolo validation
      run: python validate_palolo.py
